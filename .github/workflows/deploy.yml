name: Build, testar e publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes unitários
        run: npm run test

      - name: Configurar Java (emulador do Firestore exige JDK 21+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Testes das regras do Firestore (emulador)
        run: npx firebase-tools@latest emulators:exec --project demo-fluxo --only firestore "npx vitest run --config vitest.rules.config.ts"

      - name: Build
        run: npm run build

      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-firestore-rules:
    needs: build
    runs-on: ubuntu-latest
    # Só roda quando o segredo da conta de serviço do Firebase estiver configurado
    # (Settings > Secrets and variables > Actions > New repository secret).
    # Observação: o GitHub Actions não permite usar `secrets.*` direto em `if:`
    # de step — por isso ele é primeiro copiado para uma variável de ambiente
    # do job (`env.HAS_SERVICE_ACCOUNT`) e as steps checam essa variável.
    if: ${{ vars.VITE_FIREBASE_PROJECT_ID != '' }}
    env:
      HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Autenticar com a conta de serviço do Firebase
        if: ${{ env.HAS_SERVICE_ACCOUNT == 'true' }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Publicar regras do Firestore
        if: ${{ env.HAS_SERVICE_ACCOUNT == 'true' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project ${{ vars.VITE_FIREBASE_PROJECT_ID }} --non-interactive
